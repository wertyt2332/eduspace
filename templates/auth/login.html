{% extends "base.html" %}
{% block title %}Вход — EduSpace{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h1 class="h4 text-center mb-1">Вход в систему</h1>
        <p class="text-muted text-center small mb-4">Дистанционное обучение</p>

        <form method="post">
          <div class="mb-3">
            <label class="form-label">Логин</label>
            <input name="login" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input name="password" type="password" class="form-control" required>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="remember" name="remember">
            <label class="form-check-label small" for="remember">Запомнить меня</label>
          </div>
          <button class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right"></i> Войти
          </button>
        </form>
      </div>
    </div>
    <p class="text-center text-muted small mt-3">
      Аккаунты создаёт администратор
    </p>
  </div>
</div>
{% endblock %}
