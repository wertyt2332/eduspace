mkdir -p templates/profile
cat > templates/profile/index.html <<'EOF'
{% extends "base.html" %}
{% block title %}Профиль{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Профиль</h1>
        <p class="text-muted small mb-4">
          {{ current_user.full_name }} · <code>{{ current_user.login }}</code>
        </p>

        <h2 class="h6 text-uppercase text-muted mb-3">Смена пароля</h2>

        <form method="post">
          <div class="mb-3">
            <label class="form-label">Текущий пароль</label>
            <input name="current_password" type="password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Новый пароль</label>
            <input name="new_password" type="password" class="form-control" required minlength="6">
          </div>
          <div class="mb-3">
            <label class="form-label">Повторите новый пароль</label>
            <input name="confirm_password" type="password" class="form-control" required minlength="6">
          </div>
          <button class="btn btn-primary w-100">
            <i class="bi bi-shield-lock"></i> Сменить пароль
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
EOF
